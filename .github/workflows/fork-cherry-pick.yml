name: Cherry pick PR to Cosmos SDK [SANDBOX]
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'PR title (injection vector)'
        required: true
        default: 'fix: test'

jobs:
  cherry_pick:
    permissions: write-all
    runs-on: ubuntu-latest
    name: Cherry pick into main
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Autocreate PR — INJECTION POINT
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRBOT_PAT }}
        run: |
          echo "[SANDBOX] Title from input: ${{ inputs.title }}"
          gh pr create --repo gnomegl/gha-sandbox-kava-cherry-pick --base main --head "dummy-branch" --title "${{ inputs.title }}" --body "sandbox PoC" || echo "[SANDBOX] gh pr create failed (expected)"